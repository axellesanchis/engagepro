<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EngagePro App — Formation anglais professionnel</title>
  <meta name="description" content="Plateforme d'apprentissage d'anglais professionnel pour le e-commerce et le digital.">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,900&display=swap">
  <style>
    :root {
      --navy: #0C1826;
      --coral: #E8764A;
      --coral-light: rgba(232,118,74,0.1);
      --coral-hover: #D4613E;
      --slate: #4A5568;
      --mist: #F5F5F7;
      --surface: #FFFFFF;
      --border: rgba(12,24,38,0.06);
      --border-strong: rgba(12,24,38,0.1);
      --radius: 16px;
      --radius-sm: 12px;
      --radius-pill: 100px;
      --font: 'DM Sans', system-ui, -apple-system, sans-serif;
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: var(--font); color: var(--navy); background: var(--mist); -webkit-font-smoothing: antialiased; }
    a { color: var(--coral); text-decoration: none; }
    input, textarea, button, select { font-family: inherit; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

    .app { display: flex; height: 100vh; overflow: hidden; }

    .sidebar {
      width: 260px; background: var(--navy); padding: 24px 16px;
      display: flex; flex-direction: column; flex-shrink: 0; overflow-y: auto;
    }
    .sidebar-logo { display: flex; align-items: center; gap: 10px; padding: 0 8px; margin-bottom: 40px; }
    .sidebar-logo-icon {
      width: 36px; height: 36px; background: var(--coral); border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      color: white; font-weight: 900; font-size: 16px;
    }
    .sidebar-logo-text { font-weight: 700; font-size: 18px; color: white; }
    .sidebar-nav { display: flex; flex-direction: column; gap: 4px; flex: 1; }
    .nav-item {
      display: flex; align-items: center; gap: 12px; padding: 12px 14px;
      border-radius: var(--radius-sm); border: none; cursor: pointer;
      font-size: 15px; font-weight: 600; text-align: left; width: 100%;
      transition: all 0.15s; background: transparent; color: rgba(255,255,255,0.5);
    }
    .nav-item:hover { background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.8); }
    .nav-item.active { background: rgba(232,118,74,0.15); color: var(--coral); }
    .nav-item-icon { font-size: 18px; width: 24px; text-align: center; }
    .sidebar-level {
      padding: 16px 14px; background: rgba(255,255,255,0.05);
      border-radius: var(--radius-sm); margin-top: 16px;
    }
    .sidebar-level-label { font-size: 12px; color: rgba(255,255,255,0.4); font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
    .sidebar-level-value { font-size: 15px; color: white; font-weight: 700; }
    .sidebar-level-bar { background: rgba(255,255,255,0.1); border-radius: var(--radius-pill); height: 6px; margin-top: 10px; overflow: hidden; }
    .sidebar-level-fill { background: var(--coral); height: 100%; border-radius: var(--radius-pill); transition: width 0.5s; }
    .sidebar-back { display: flex; align-items: center; gap: 8px; padding: 12px 14px; color: rgba(255,255,255,0.4); font-size: 13px; font-weight: 600; text-decoration: none; margin-top: 12px; border-radius: var(--radius-sm); transition: all 0.15s; }
    .sidebar-back:hover { color: rgba(255,255,255,0.8); background: rgba(255,255,255,0.05); }
    .sidebar-user {
      display: flex; align-items: center; gap: 12px; padding: 12px 14px;
      border-radius: var(--radius-sm); cursor: pointer; margin-bottom: 12px;
      transition: all 0.15s; background: rgba(255,255,255,0.05); border: none; width: 100%; text-align: left;
    }
    .sidebar-user:hover { background: rgba(255,255,255,0.1); }
    .sidebar-user-avatar {
      width: 36px; height: 36px; background: var(--coral); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: white; font-weight: 800; font-size: 14px; flex-shrink: 0;
    }
    .sidebar-user-name { font-size: 14px; font-weight: 600; color: white; }
    .sidebar-user-sub { font-size: 12px; color: rgba(255,255,255,0.4); }

    .main { flex: 1; overflow-y: auto; padding: 32px 40px; }
    .page { display: none; animation: fadeIn 0.4s ease both; }
    .page.active { display: block; }
    .page-title { font-size: 28px; font-weight: 900; margin-bottom: 4px; }
    .page-subtitle { font-size: 15px; color: var(--slate); }
    .page-header { margin-bottom: 32px; }

    .card {
      background: var(--surface); border-radius: 20px; padding: 28px;
      border: 1px solid var(--border); transition: all 0.2s;
    }
    .card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(12,24,38,0.08); }
    .card-icon {
      width: 48px; height: 48px; background: var(--coral-light); border-radius: 14px;
      display: flex; align-items: center; justify-content: center; margin-bottom: 16px; font-size: 22px;
    }
    .card-title { font-size: 17px; font-weight: 700; margin-bottom: 6px; }
    .card-desc { font-size: 14px; color: var(--slate); line-height: 1.5; }
    .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }

    .btn {
      padding: 14px 28px; border-radius: var(--radius-pill); border: none;
      font-weight: 700; font-size: 15px; cursor: pointer; transition: all 0.2s;
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-primary { background: var(--navy); color: white; }
    .btn-primary:hover { background: var(--coral); }
    .btn-coral { background: var(--coral); color: white; }
    .btn-coral:hover { background: var(--coral-hover); transform: translateY(-2px); }
    .btn-outline { background: var(--surface); color: var(--navy); border: 1px solid var(--border-strong); }
    .btn-outline:hover { background: var(--navy); color: white; border-color: var(--navy); }
    .btn-sm { padding: 10px 20px; font-size: 14px; }
    .btn-ghost { background: transparent; color: var(--slate); padding: 10px 20px; font-size: 14px; font-weight: 600; }
    .btn-danger { background: rgba(239,68,68,0.1); color: #EF4444; }
    .btn-danger:hover { background: rgba(239,68,68,0.2); }

    .tag { display: inline-flex; padding: 6px 14px; border-radius: var(--radius-pill); font-size: 12px; font-weight: 600; }
    .tag-coral { background: var(--coral-light); color: var(--coral); }
    .tag-muted { background: rgba(12,24,38,0.05); color: var(--slate); }

    .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; margin-bottom: 40px; }
    .stat-card { background: var(--surface); border-radius: var(--radius); padding: 24px; border: 1px solid var(--border); }
    .stat-label { font-size: 13px; color: var(--slate); font-weight: 600; margin-bottom: 8px; }
    .stat-value { font-size: 32px; font-weight: 900; }

    .progress-bar { background: rgba(12,24,38,0.06); border-radius: var(--radius-pill); height: 8px; overflow: hidden; }
    .progress-fill { background: var(--coral); height: 100%; border-radius: var(--radius-pill); transition: width 0.4s; }

    .flashcard {
      background: var(--surface); border-radius: 24px; padding: 48px; text-align: center;
      border: 1px solid var(--border); cursor: pointer; min-height: 240px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: all 0.3s;
    }
    .flashcard:hover { box-shadow: 0 8px 32px rgba(12,24,38,0.08); }
    .flashcard-cat { font-size: 14px; color: var(--coral); font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 16px; }
    .flashcard-en { font-size: 32px; font-weight: 900; margin-bottom: 12px; }
    .flashcard-fr { font-size: 22px; color: var(--coral); font-weight: 700; margin-bottom: 12px; }
    .flashcard-example { font-size: 15px; color: var(--slate); line-height: 1.6; max-width: 400px; font-style: italic; }
    .flashcard-hint { font-size: 15px; color: var(--slate); }
    .flashcard-actions { display: flex; justify-content: center; gap: 12px; margin-top: 20px; }
    .flashcard-progress { text-align: center; margin-top: 16px; font-size: 14px; color: var(--slate); }
    .btn-hard { background: rgba(239,68,68,0.1); color: #EF4444; }
    .btn-hard:hover { background: rgba(239,68,68,0.2); }
    .btn-easy { background: rgba(34,197,94,0.1); color: #16A34A; }
    .btn-easy:hover { background: rgba(34,197,94,0.2); }

    .filter-bar { display: flex; gap: 8px; flex-wrap: wrap; }
    .filter-btn { padding: 10px 20px; border-radius: var(--radius-pill); border: 1px solid var(--border-strong); background: var(--surface); color: var(--navy); font-weight: 600; font-size: 14px; cursor: pointer; transition: all 0.15s; }
    .filter-btn.active { background: var(--navy); color: white; border-color: var(--navy); }

    .vocab-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
    .vocab-item {
      background: var(--surface); border-radius: 14px; padding: 18px 20px;
      border: 1px solid var(--border); display: flex; align-items: flex-start;
      justify-content: space-between; gap: 12px;
    }
    .vocab-en { font-size: 16px; font-weight: 700; }
    .vocab-fr { font-size: 14px; color: var(--slate); margin-top: 2px; }

    .test-card {
      background: var(--surface); border-radius: 24px; padding: 40px;
      border: 1px solid var(--border); max-width: 680px; margin: 0 auto;
    }
    .test-option {
      text-align: left; padding: 16px 20px; border-radius: 14px;
      border: 2px solid var(--border-strong); background: var(--surface);
      cursor: pointer; font-size: 15px; color: var(--slate); font-weight: 500;
      line-height: 1.5; transition: all 0.15s; width: 100%; display: block;
    }
    .test-option:hover { border-color: var(--coral); }
    .test-option.selected { border-color: var(--coral); background: rgba(232,118,74,0.05); color: var(--navy); }
    .test-textarea {
      width: 100%; min-height: 120px; padding: 16px 20px; border-radius: 14px;
      border: 1px solid var(--border-strong); font-size: 15px; line-height: 1.7;
      resize: vertical; color: var(--navy);
    }
    .test-textarea:focus { outline: none; border-color: var(--coral); }
    .test-result-hero {
      background: var(--navy); border-radius: 24px; padding: 48px; text-align: center;
      margin-bottom: 24px; position: relative; overflow: hidden;
    }
    .test-result-hero::before {
      content: ''; position: absolute; top: -40px; right: -40px;
      width: 140px; height: 140px; background: var(--coral); border-radius: 50%; opacity: 0.1;
    }
    .test-result-level { font-size: 64px; font-weight: 900; color: var(--coral); line-height: 1; position: relative; }
    .test-result-label { font-size: 20px; color: white; font-weight: 700; margin-top: 8px; position: relative; }
    .test-result-score { font-size: 16px; color: rgba(255,255,255,0.5); margin-top: 4px; position: relative; }

    .meeting-card { background: var(--surface); border-radius: 20px; padding: 28px; border: 1px solid var(--border); }
    .meeting-card h3 { font-size: 18px; font-weight: 700; margin-bottom: 16px; }
    .meeting-phrase { background: var(--mist); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px; }
    .meeting-phrase-en { font-size: 14px; font-weight: 600; }
    .meeting-phrase-fr { font-size: 13px; color: var(--slate); margin-top: 2px; }

    .coming-soon {
      max-width: 500px; margin: 60px auto; text-align: center; padding: 40px;
      background: var(--surface); border-radius: 24px; border: 1px solid var(--border);
    }
    .coming-soon-icon {
      width: 64px; height: 64px; background: var(--coral-light); border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 24px; font-size: 28px;
    }
    .coming-soon h2 { font-size: 22px; font-weight: 800; margin-bottom: 10px; }
    .coming-soon p { font-size: 15px; color: var(--slate); line-height: 1.6; }
    .coming-soon .tag { margin-top: 20px; }

    .chat-container { display: flex; flex-direction: column; height: calc(100vh - 130px); }
    .chat-messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; padding-bottom: 16px; }
    .chat-bubble { max-width: 75%; padding: 16px 20px; border-radius: 20px; font-size: 15px; line-height: 1.65; }
    .chat-bubble-user { background: var(--navy); color: white; align-self: flex-end; border-top-right-radius: 6px; }
    .chat-bubble-ai { background: var(--surface); color: var(--navy); align-self: flex-start; border-top-left-radius: 6px; border: 1px solid var(--border); }
    .chat-bubble-correction { background: rgba(232,118,74,0.08); color: var(--navy); align-self: flex-start; border: 1px solid rgba(232,118,74,0.2); border-top-left-radius: 6px; }
    .chat-correction-label { font-size: 12px; font-weight: 700; color: var(--coral); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
    .chat-input-bar { display: flex; gap: 12px; padding-top: 16px; border-top: 1px solid var(--border); }
    .chat-input { flex: 1; padding: 14px 20px; border-radius: var(--radius-pill); border: 1px solid var(--border-strong); font-size: 15px; background: var(--surface); transition: border-color 0.2s; }
    .chat-input:focus { outline: none; border-color: var(--coral); }
    .chat-typing { align-self: flex-start; background: var(--surface); padding: 16px 20px; border-radius: 20px; border-top-left-radius: 6px; border: 1px solid var(--border); color: var(--slate); font-size: 14px; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    .chat-typing span { animation: pulse 1.2s infinite; }

    .sim-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; background: var(--navy); border-radius: var(--radius); margin-bottom: 20px; }
    .sim-header-title { font-size: 17px; color: white; font-weight: 700; }
    .sim-header-label { font-size: 14px; color: rgba(255,255,255,0.5); font-weight: 600; }

    .email-brief { background: var(--navy); border-radius: var(--radius); padding: 20px 24px; margin-bottom: 24px; }
    .email-brief-label { font-size: 14px; color: rgba(255,255,255,0.5); font-weight: 600; margin-bottom: 4px; }
    .email-brief-text { font-size: 15px; color: white; line-height: 1.6; }
    .email-editor { background: var(--surface); border-radius: 20px; border: 1px solid var(--border); overflow: hidden; }
    .email-field { display: flex; align-items: center; gap: 8px; padding: 12px 24px; border-bottom: 1px solid var(--border); }
    .email-field label { font-size: 14px; color: var(--slate); font-weight: 600; width: 55px; }
    .email-field input { flex: 1; border: none; font-size: 14px; color: var(--navy); background: transparent; outline: none; }
    .email-body { width: 100%; min-height: 220px; padding: 20px 24px; border: none; font-size: 15px; line-height: 1.7; resize: vertical; color: var(--navy); font-family: var(--font); }
    .email-body:focus { outline: none; }
    .email-feedback { background: var(--surface); border-radius: 20px; padding: 28px; border: 1px solid var(--border); margin-top: 24px; white-space: pre-wrap; font-size: 15px; line-height: 1.8; }

    .gate-screen { max-width: 500px; margin: 80px auto; text-align: center; }
    .gate-icon {
      width: 64px; height: 64px; background: var(--coral-light); border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 24px; font-size: 28px;
    }

    .session-screen {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 20px; background: var(--mist);
    }
    .session-box {
      background: var(--surface); border-radius: 28px; padding: 48px;
      max-width: 480px; width: 100%; border: 1px solid var(--border);
      box-shadow: 0 8px 32px rgba(12,24,38,0.06);
    }
    .session-title { font-size: 28px; font-weight: 900; margin-bottom: 8px; text-align: center; }
    .session-subtitle { font-size: 15px; color: var(--slate); text-align: center; margin-bottom: 36px; }
    .session-profiles { display: flex; flex-direction: column; gap: 10px; margin-bottom: 32px; }
    .session-profile-btn {
      display: flex; align-items: center; gap: 14px; padding: 16px 20px;
      border-radius: var(--radius); border: 2px solid var(--border-strong);
      background: var(--surface); cursor: pointer; transition: all 0.15s; width: 100%;
      text-align: left;
    }
    .session-profile-btn:hover { border-color: var(--coral); background: rgba(232,118,74,0.03); }
    .session-profile-avatar {
      width: 44px; height: 44px; background: var(--coral); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: white; font-weight: 800; font-size: 16px; flex-shrink: 0;
    }
    .session-profile-name { font-size: 16px; font-weight: 700; }
    .session-profile-level { font-size: 13px; color: var(--slate); margin-top: 2px; }
    .session-divider {
      text-align: center; color: var(--slate); font-size: 13px; font-weight: 600;
      margin: 24px 0; position: relative;
    }
    .session-divider::before, .session-divider::after {
      content: ''; position: absolute; top: 50%; height: 1px;
      background: var(--border-strong); width: calc(50% - 40px);
    }
    .session-divider::before { left: 0; }
    .session-divider::after { right: 0; }
    .session-form { display: flex; flex-direction: column; gap: 12px; }
    .session-input {
      padding: 14px 20px; border-radius: var(--radius-sm); border: 1px solid var(--border-strong);
      font-size: 15px; color: var(--navy); background: var(--surface); transition: border-color 0.2s;
    }
    .session-input:focus { outline: none; border-color: var(--coral); }

    .profile-header {
      display: flex; align-items: center; gap: 24px; margin-bottom: 40px;
    }
    .profile-avatar {
      width: 80px; height: 80px; background: var(--coral); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: white; font-weight: 900; font-size: 28px; flex-shrink: 0;
    }
    .profile-name { font-size: 28px; font-weight: 900; }
    .profile-level { font-size: 16px; color: var(--slate); margin-top: 4px; }

    .test-nav-bar {
      display: flex; justify-content: space-between; align-items: center; margin-top: 24px;
    }
    .test-back-btn {
      background: none; border: none; cursor: pointer; font-size: 14px;
      font-weight: 600; color: var(--slate); display: flex; align-items: center; gap: 6px;
      transition: color 0.15s; padding: 8px 0;
    }
    .test-back-btn:hover { color: var(--navy); }
    .test-back-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    .corrections-section {
      background: var(--surface); border-radius: 20px; padding: 28px;
      border: 1px solid var(--border); margin-bottom: 24px;
    }
    .corrections-section h3 { font-size: 18px; font-weight: 700; margin-bottom: 16px; color: var(--coral); }
    .corrections-content { font-size: 15px; line-height: 1.8; white-space: pre-wrap; }

    .oral-mic-btn {
      width: 72px; height: 72px; border-radius: 50%; border: none;
      color: white; font-size: 28px; cursor: pointer; transition: all 0.2s;
      display: flex; align-items: center; justify-content: center; margin: 0 auto;
    }
    .oral-mic-btn:hover { transform: scale(1.05); }
    .oral-mic-label { font-size: 13px; color: var(--slate); margin-top: 10px; font-weight: 600; text-align: center; }
    .oral-transcript-bar {
      display: flex; align-items: center; gap: 12px; padding-top: 12px;
    }
    .oral-transcript-text {
      flex: 1; padding: 12px 16px; background: rgba(12,24,38,0.03);
      border-radius: 12px; font-size: 14px; color: var(--slate); font-style: italic;
    }
    .oral-text-input {
      flex: 0 1 300px; padding: 10px 16px; border-radius: var(--radius-pill);
      border: 1px solid rgba(12,24,38,0.08); font-size: 14px; background: var(--surface);
    }
    .oral-text-input:focus { outline: none; border-color: var(--coral); }
    .oral-topics { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; margin-bottom: 24px; }
    .oral-topic-btn {
      padding: 14px 18px; border-radius: var(--radius); border: 1px solid var(--border-strong);
      background: var(--surface); cursor: pointer; font-size: 14px; font-weight: 600;
      color: var(--navy); text-align: left; transition: all 0.15s;
    }
    .oral-topic-btn:hover { border-color: var(--coral); background: rgba(232,118,74,0.03); }
    .oral-speak-btn {
      background: none; border: none; cursor: pointer; font-size: 13px; color: var(--slate);
      display: flex; align-items: center; gap: 4px; padding: 2px 6px;
      border-radius: 6px; transition: color 0.15s;
    }
    .oral-speak-btn:hover { color: var(--coral); }
    .mic-overlay {
      position: fixed; inset: 0; background: rgba(12,24,38,0.5); z-index: 10000;
      display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px);
    }
    .mic-overlay-card {
      background: var(--surface); border-radius: 24px; padding: 40px;
      max-width: 400px; text-align: center; font-family: var(--font);
    }

    .mobile-nav {
      display: none; position: fixed; bottom: 0; left: 0; right: 0;
      background: var(--navy); padding: 8px 16px; z-index: 100;
      justify-content: space-around; border-top: 1px solid rgba(255,255,255,0.1);
    }
    .mobile-nav-item {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      background: none; border: none; cursor: pointer; padding: 8px 12px;
      color: rgba(255,255,255,0.5); font-size: 11px; font-weight: 600;
      border-radius: 8px; transition: all 0.15s;
    }
    .mobile-nav-item.active { color: var(--coral); }
    .mobile-nav-item span:first-child { font-size: 20px; }

    @media (max-width: 768px) {
      .sidebar { display: none; }
      .mobile-nav { display: flex; }
      .main { padding: 20px 16px 80px; }

function ls(key, fallback) {
  try { const v = localStorage.getItem(key); return v !== null ? JSON.parse(v) : fallback; }
  catch { return fallback; }
}
function lsRaw(key) { try { return localStorage.getItem(key); } catch { return null; } }
function lsSet(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch {} }
function lsSetRaw(key, val) { try { localStorage.setItem(key, val); } catch {} }
function lsRemove(key) { try { localStorage.removeItem(key); } catch {} }

const state = {
  activeUserId: lsRaw('ep_active_user'),
  users: ls('ep_users', []),
  newFirstName: '',
  newLastName: '',
  page: 'dashboard',
  testPhase: 'idle',
  testIndex: 0,
  testAnswers: [],
  testOpenAnswer: '',
  testSelected: null,
  testResult: null,
  userLevel: null,
  vocabCat: 'all',
  cardIndex: 0,
  flipped: false,
  learnedWords: [],
  hardWords: [],
  conversationCount: 0,
  emailsWritten: 0,
  simsCompleted: 0,
  chatMessages: [{ role: 'assistant', text: "Hi! I'm your English practice partner. I'm here to help you improve your professional English. Talk to me about anything related to e-commerce, project management, or digital topics. I'll correct your mistakes and suggest better phrasing. Let's start — tell me about your last project!" }],
  chatInput: '',
  isTyping: false,
  activeSim: null,

  listeningFor: null,
  autoSpeak: true,
};

function ukey(key) { return `ep_${state.activeUserId}_${key}`; }

function loadUserData(userId) {
  const uk = (k) => `ep_${userId}_${k}`;
  const level = lsRaw(uk('level'));
  const testResult = ls(uk('test_result'), null);
  state.activeUserId = userId;
  state.page = level ? 'dashboard' : 'test';
  state.userLevel = level;
  state.testResult = testResult;
  state.testPhase = testResult ? 'done' : 'idle';
  state.testIndex = 0;
  state.testAnswers = [];
  state.testSelected = null;
  state.testOpenAnswer = '';
  state.learnedWords = ls(uk('learned'), []);
  state.hardWords = ls(uk('hard'), []);
  state.conversationCount = parseInt(lsRaw(uk('convos')) || '0', 10);
  state.emailsWritten = parseInt(lsRaw(uk('emails')) || '0', 10);
  state.simsCompleted = parseInt(lsRaw(uk('sims')) || '0', 10);
  state.chatMessages = [{ role: 'assistant', text: "Hi! I'm your English practice partner. I'm here to help you improve your professional English. Talk to me about anything related to e-commerce, project management, or digital topics. I'll correct your mistakes and suggest better phrasing. Let's start — tell me about your last project!" }];
  state.chatInput = '';
  state.isTyping = false;
  state.activeSim = null;
  state.simMessages = [];
  state.simInput = '';
  state.isSimTyping = false;
  state.activeEmail = null;
  state.emailTo = '';
  state.emailSubject = '';
  state.emailBody = '';
  state.emailFeedback = null;
  state.vocabCat = 'all';
  state.cardIndex = 0;
  state.flipped = false;
  state.oralMessages = [{ role: 'assistant', text: "Hello! I'm your English speaking partner. Let's have a conversation. Pick a topic or just start talking! I'll respond out loud and correct any mistakes I hear. Ready?" }];
  state.oralInput = '';
  state.oralTextInput = '';
  state.isOralTyping = false;
  state.listeningFor = null;
  state.autoSpeak = true;
}

function getActiveUser() {
  return state.users.find(u => u.id === state.activeUserId) || null;
}

function createProfile() {
  const fn = state.newFirstName.trim();
  const ln = state.newLastName.trim();
  if (!fn || !ln) return;
  const id = 'u' + Date.now();
  const users = [...state.users, { id, firstName: fn, lastName: ln }];
  lsSet('ep_users', users);
  lsSetRaw('ep_active_user', id);
  state.users = users;
  state.newFirstName = '';
  state.newLastName = '';
  loadUserData(id);
  render();
}

function loginProfile(userId) {
  lsSetRaw('ep_active_user', userId);
  loadUserData(userId);
  render();
}

function switchProfile() {
  lsRemove('ep_active_user');
  state.activeUserId = null;
  render();
}

function deleteProfile() {
  const uid = state.activeUserId;
  const users = state.users.filter(u => u.id !== uid);
  lsSet('ep_users', users);
  lsRemove('ep_active_user');
  ['level','test_result','learned','hard','convos','emails','sims'].forEach(k => lsRemove(`ep_${uid}_${k}`));
  state.users = users;
  state.activeUserId = null;
  render();
}

if (state.activeUserId) {
  loadUserData(state.activeUserId);
}

function navigate(page) {
  if (!state.userLevel && ['vocab','chat','oral','sim','email','meeting','dashboard'].includes(page) && page !== 'test') {
    state.page = 'gate';
    state.gateTo = page;
  } else {
    state.page = page;
  }
  if (page === 'vocab') { state.cardIndex = 0; state.flipped = false; }
  render();
  const mainEl = document.getElementById('main');
  if (mainEl) mainEl.scrollTop = 0;
}

function getFilteredVocab() {
  if (state.vocabCat === 'all') return VOCAB;
  const map = { pm: 'Gestion de projet', ecom: 'E-commerce', tech: 'Tech' };
  return VOCAB.filter(w => w.cat === map[state.vocabCat]);
}

function selectAnswer(i) {
  state.testAnswers[state.testIndex] = i;
  state.testSelected = i;
  render();
}

function nextMCQ() {
  if (state.testIndex < TEST_QUESTIONS.length - 1) {
    state.testIndex++;
    state.testSelected = state.testAnswers[state.testIndex] ?? null;
    state.testOpenAnswer = typeof state.testAnswers[state.testIndex] === 'string' ? state.testAnswers[state.testIndex] : '';
    render();
  } else {
    finishTest();
  }
}

function goBackQuestion() {
  if (state.testIndex <= 0) return;
  state.testIndex--;
  const prevAnswer = state.testAnswers[state.testIndex];
  const prevQ = TEST_QUESTIONS[state.testIndex];
  state.testSelected = prevQ.type === 'mcq' ? (prevAnswer ?? null) : null;
  state.testOpenAnswer = prevQ.type === 'open' ? (prevAnswer || '') : '';
  render();
}

function submitOpenAnswer() {
  if (!state.testOpenAnswer.trim()) return;
  state.testAnswers[state.testIndex] = state.testOpenAnswer;
  if (state.testIndex < TEST_QUESTIONS.length - 1) {
    state.testIndex++;
    state.testSelected = state.testAnswers[state.testIndex] ?? null;
    state.testOpenAnswer = typeof state.testAnswers[state.testIndex] === 'string' ? state.testAnswers[state.testIndex] : '';
    render();
  } else {
    finishTest();
  }
}

function calculateLevel(answers) {
  let score = 0;
  answers.forEach((a, i) => {
    const q = TEST_QUESTIONS[i];
    if (q.type === 'mcq') {
      if (a === q.correct) score++;
    } else if (typeof a === 'string' && a.trim().split(/\s+/).length >= 10) {
      score += 0.8;
    } else if (typeof a === 'string' && a.trim().length > 0) {
      score += 0.4;
    }
  });
  const pct = score / TEST_QUESTIONS.length;
  const mcqCorrect = answers.reduce((n, a, i) => TEST_QUESTIONS[i].type === 'mcq' && a === TEST_QUESTIONS[i].correct ? n + 1 : n, 0);
  const mcqTotal = TEST_QUESTIONS.filter(q => q.type === 'mcq').length;
  let level, labelFR;
  if (pct >= 0.92) { level = 'C2'; labelFR = 'Maîtrise'; }
  else if (pct >= 0.78) { level = 'C1'; labelFR = 'Avancé'; }
  else if (pct >= 0.60) { level = 'B2'; labelFR = 'Intermédiaire avancé'; }
  else if (pct >= 0.42) { level = 'B1'; labelFR = 'Intermédiaire'; }
  else if (pct >= 0.22) { level = 'A2'; labelFR = 'Élémentaire'; }
  else { level = 'A1'; labelFR = 'Débutant'; }
  const analyses = {
    C2: `Excellent ! Vous avez obtenu ${mcqCorrect}/${mcqTotal} aux QCM. Votre maîtrise de l'anglais professionnel est remarquable.`,
    C1: `Très bon résultat avec ${mcqCorrect}/${mcqTotal} aux QCM. Vous maîtrisez l'anglais professionnel avec aisance.`,
    B2: `Bon résultat avec ${mcqCorrect}/${mcqTotal} aux QCM. Vous pouvez participer à la plupart des situations professionnelles en anglais.`,
    B1: `Score de ${mcqCorrect}/${mcqTotal} aux QCM. Vous avez des bases solides en anglais professionnel.`,
    A2: `Score de ${mcqCorrect}/${mcqTotal} aux QCM. Vous avez des notions d'anglais mais le vocabulaire professionnel reste à construire.`,
    A1: `Score de ${mcqCorrect}/${mcqTotal} aux QCM. L'anglais professionnel est encore un territoire à explorer. Pas d'inquiétude, les progrès seront rapides avec un programme adapté.`,
  };

async function finishTest() {
  state.testPhase = 'analyzing';
  render();

  const answers = state.testAnswers;
  let mcqCorrect = 0;
  const mcqTotal = TEST_QUESTIONS.filter(q => q.type === 'mcq').length;
  const openAnswers = [];

  answers.forEach((a, i) => {
    const q = TEST_QUESTIONS[i];
    if (q.type === 'mcq') {
      if (a === q.correct) mcqCorrect++;
    } else if (typeof a === 'string') {
      openAnswers.push({ question: q.q, context: q.context || '', difficulty: q.diff, answer: a });
    }
  });

  const mcqDetails = answers.map((a, i) => {
    const q = TEST_QUESTIONS[i];
    if (q.type !== 'mcq') return null;
    return `Q${i + 1} [${q.diff}]: ${q.q}\nUser chose: "${q.options[a]}"\nCorrect: "${q.options[q.correct]}" ${a === q.correct ? '✓' : '✗'}`;
  }).filter(Boolean).join('\n\n');

  const prompt = `You are an English language assessor specializing in professional/business English for digital project managers in e-commerce.

The user completed a placement test. Here are their results:

MCQ SCORE: ${mcqCorrect}/${mcqTotal} correct

MCQ DETAILS:
${mcqDetails}

OPEN-ENDED ANSWERS:
${openAnswers.map((oa, i) => `Q${i + 1} [${oa.difficulty}]: ${oa.question}\nContext: ${oa.context}\nAnswer: "${oa.answer}"\n`).join('\n')}

Based on ALL answers (MCQ accuracy AND quality of open-ended writing), determine their CEFR level.

Respond in this EXACT JSON format (no markdown, no code fences):
{"level":"B2","labelFR":"Intermédiaire avancé","score":"${mcqCorrect}/${mcqTotal} aux QCM","analysis":"Your detailed analysis here in French (3-4 paragraphs):\\n\\n1) Overall level assessment\\n2) Strengths observed\\n3) Areas for improvement\\n4) Recommended focus areas","corrections":"Detailed corrections in French for EACH wrong MCQ answer and EACH open-ended answer: explain what was wrong, give the correct answer/better phrasing, and a brief tip. Format each correction on its own line with the question number."}

Level descriptors for reference:
- A1: Absolute beginner, knows almost no professional English
- A2: Basic vocabulary, very simple sentences
- B1: Can handle simple professional situations
- B2: Can participate in most professional discussions
- C1: Can express complex ideas fluently
- C2: Near-native professional fluency

The labelFR should be one of: Débutant (A1), Élémentaire (A2), Intermédiaire (B1), Intermédiaire avancé (B2), Avancé (C1), Maîtrise (C2)`;

  try {
    const r = await aiChat('You are a language assessment AI. Return ONLY valid JSON, no markdown.', [{ role: 'user', text: prompt }], 2048);
    const cleaned = r.replace(/```json\n?/g, '').replace(/```\n?/g, '').trim();
    const result = JSON.parse(cleaned);
    lsSetRaw(ukey('level'), result.level);
    lsSet(ukey('test_result'), result);
    state.testPhase = 'done';
    state.testResult = result;
    state.userLevel = result.level;
  } catch (e) {
    const fallback = calculateLevel(answers);
    lsSetRaw(ukey('level'), fallback.level);
    lsSet(ukey('test_result'), fallback);
    state.testPhase = 'done';
    state.testResult = fallback;
    state.userLevel = fallback.level;
  }
  render();
}

async function aiChat(system, messages, maxTokens) {
  const res = await fetch('/.netlify/functions/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ system, messages: messages.map(m => ({ role: m.role, content: m.text })), max_tokens: maxTokens || 1024 }),
  });
  if (!res.ok) throw new Error('API error');
  const data = await res.json();
  return data.text;
}

function parseChatResponse(text) {
  const msgs = [];
  if (text.includes('✏ Correction:')) {
    const parts = text.split('✏ Correction:');
    msgs.push({ role: 'assistant', text: parts[0].trim() });
    msgs.push({ role: 'assistant', text: parts[1].trim(), isCorrection: true });
  } else {
    msgs.push({ role: 'assistant', text });
  }
  return msgs;
}

function speakText(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const utt = new SpeechSynthesisUtterance(text);
  utt.lang = 'en-US';
  utt.rate = 0.95;
  utt.pitch = 1.0;
  const voices = window.speechSynthesis.getVoices();
  const preferred = [
    v => v.lang.startsWith('en') && v.name.includes('Natural'),
    v => v.lang.startsWith('en') && v.name.includes('Samantha'),
    v => v.lang.startsWith('en') && v.name.includes('Karen'),
    v => v.lang.startsWith('en') && v.name.includes('Daniel'),
    v => v.lang.startsWith('en') && v.name.includes('Google UK English Female'),
    v => v.lang.startsWith('en') && v.name.includes('Google UK English Male'),
    v => v.lang.startsWith('en-GB'),
    v => v.lang.startsWith('en') && v.name.includes('Google'),
    v => v.lang.startsWith('en-US'),
    v => v.lang.startsWith('en'),
  ];
  let picked = null;
  for (const fn of preferred) {
    picked = voices.find(fn);
    if (picked) break;
  }
  if (picked) utt.voice = picked;
  window.speechSynthesis.speak(utt);
}
if (window.speechSynthesis) {
  window.speechSynthesis.onvoiceschanged = () => {};
  window.speechSynthesis.getVoices();

let _micAllowed = false;
let _recognition = null;

function requestMicPermission() {
  return new Promise((resolve) => {
    const overlay = document.createElement('div');
    overlay.className = 'mic-overlay';
    const card = document.createElement('div');
    card.className = 'mic-overlay-card';
    card.innerHTML = `
      <div class="gate-icon" style="margin:0 auto 20px;">🎙</div>
      <h3 style="font-size:20px;font-weight:800;margin-bottom:8px;">Autoriser le microphone</h3>
      <p style="font-size:15px;color:var(--slate);line-height:1.6;margin-bottom:24px;">Pour la conversation orale, l'application a besoin d'accéder à votre microphone. Cliquez sur "Autoriser" puis acceptez la demande du navigateur.</p>
      <div style="display:flex;gap:12px;justify-content:center;">
        <button id="mic-deny" class="btn btn-outline btn-sm">Non merci</button>
        <button id="mic-allow" class="btn btn-primary btn-sm">Autoriser</button>
      </div>
    `;
    overlay.appendChild(card);
    document.body.appendChild(overlay);
    card.querySelector('#mic-deny').onclick = () => { document.body.removeChild(overlay); resolve(false); };
    card.querySelector('#mic-allow').onclick = async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        stream.getTracks().forEach(t => t.stop());
        document.body.removeChild(overlay);
        resolve(true);
      } catch (err) {
        card.querySelector('p').textContent = "Permission refusée par le navigateur. Vérifiez les paramètres (icône cadenas dans la barre d'adresse) et rechargez la page.";
        card.querySelector('#mic-allow').textContent = 'Réessayer';
      }
    };
  });
}

async function toggleMic(inputKey) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    alert("La reconnaissance vocale n'est pas supportée par votre navigateur. Utilisez Chrome ou Edge.");
    return;
  }
  if (_recognition) {
    _recognition.stop();
    _recognition = null;
    state.listeningFor = null;
    render();
    return;
  }
  if (!_micAllowed) {
    const allowed = await requestMicPermission();
    if (!allowed) return;
    _micAllowed = true;
  }
  const recognition = new SR();
  recognition.lang = 'en-US';
  recognition.interimResults = true;
  recognition.continuous = true;
  recognition.maxAlternatives = 1;
  _recognition = recognition;
  state.listeningFor = inputKey;
  render();
  recognition.onresult = (e) => {
    let transcript = '';
    for (let i = 0; i < e.results.length; i++) {
      transcript += e.results[i][0].transcript;
    }
    state[inputKey] = transcript;
    render();
  };
  recognition.onend = () => { _recognition = null; state.listeningFor = null; render(); };
  recognition.onerror = (e) => {
    _recognition = null; state.listeningFor = null; render();
    if (e.error === 'not-allowed') { _micAllowed = false; }
  };
  recognition.start();
}

  if (state.testPhase === 'inprogress') {
    const q = TEST_QUESTIONS[state.testIndex];
    const pct = ((state.testIndex) / TEST_QUESTIONS.length * 100).toFixed(0);
    let body = '';
    if (q.type === 'mcq') {
      body = `<div style="display:flex;flex-direction:column;gap:10px;margin-top:20px;">
        ${q.options.map((opt, i) => `<button class="test-option ${state.testSelected === i ? 'selected' : ''}" onclick="selectAnswer(${i})">${esc(opt)}</button>`).join('')}
      </div>
      <div class="test-nav-bar">
        <button class="test-back-btn" onclick="goBackQuestion()" ${state.testIndex === 0 ? 'disabled' : ''}>← Précédent</button>
        ${state.testSelected !== null ? `<button class="btn btn-primary btn-sm" onclick="nextMCQ()">Suivant →</button>` : '<div></div>'}
      </div>`;
    } else {
      body = `<div style="margin-top:20px;">
        ${q.context ? `<p style="font-size:15px;color:var(--slate);line-height:1.6;margin-bottom:16px;font-style:italic;">${esc(q.context)}</p>` : ''}
        <textarea class="test-textarea" placeholder="Write your answer in English…" oninput="state.testOpenAnswer=this.value">${esc(state.testOpenAnswer)}</textarea>
        <div class="test-nav-bar">
          <button class="test-back-btn" onclick="goBackQuestion()" ${state.testIndex === 0 ? 'disabled' : ''}>← Précédent</button>
          <button class="btn btn-primary btn-sm" onclick="submitOpenAnswer()">Valider →</button>
        </div>
      </div>`;
    }
    return `<div class="page-header"><h1 class="page-title">Test de niveau</h1><p class="page-subtitle">Évaluez votre anglais professionnel en 20 questions</p></div>
      <div style="max-width:680px;margin:0 auto;">
        <div style="display:flex;align-items:center;gap:16px;margin-bottom:32px;">
          <div class="progress-bar" style="flex:1;"><div class="progress-fill" style="width:${pct}%"></div></div>
          <span style="font-size:14px;font-weight:700;color:var(--slate);white-space:nowrap;">${state.testIndex + 1} / ${TEST_QUESTIONS.length}</span>
        </div>
        <div class="test-card">
          <div style="display:flex;gap:8px;margin-bottom:20px;">
            <span class="tag tag-coral">${esc(q.cat)}</span>
            <span class="tag tag-muted">${esc(q.diff)}</span>
          </div>
          <h3 style="font-size:20px;font-weight:800;line-height:1.4;margin-bottom:8px;">${esc(q.q)}</h3>
          ${body}
        </div>
      </div>`;
  }
  if (state.testPhase === 'done' && state.testResult) {
    const r = state.testResult;
    const correctionsHtml = r.corrections ? `
      <div class="corrections-section">
        <h3>Corrections détaillées</h3>
        <div class="corrections-content">${esc(r.corrections)}</div>
      </div>` : '';
    return `<div class="page-header"><h1 class="page-title">Test de niveau</h1></div>
      <div style="max-width:680px;margin:0 auto;">
        <div class="test-result-hero">
          <p style="font-size:14px;color:rgba(255,255,255,0.5);font-weight:600;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:8px;position:relative;">Votre niveau</p>
          <p class="test-result-level">${esc(r.level)}</p>
          <p class="test-result-label">${esc(r.labelFR)}</p>
          <p class="test-result-score">${esc(r.score)}</p>
        </div>
        <div class="card" style="margin-bottom:24px;cursor:default;" onmouseenter="" onmouseleave="">
          <h3 style="font-size:18px;font-weight:700;margin-bottom:16px;">Analyse</h3>
          <p style="font-size:15px;line-height:1.8;color:var(--navy);white-space:pre-wrap;">${esc(r.analysis)}</p>
        </div>
        ${correctionsHtml}
        <div style="display:flex;gap:12px;">
          <button class="btn btn-primary" style="flex:1;" onclick="navigate('dashboard')">Commencer la formation</button>
          <button class="btn btn-outline" onclick="retakeTest()">Repasser le test</button>
        </div>
      </div>`;
  }
  return '';
}

function renderDashboard() {
  const activeUser = getActiveUser();
  const greeting = activeUser ? `Bonjour ${esc(activeUser.firstName)} 👋` : 'Bonjour 👋';
  return `<div>
    <div style="margin-bottom:40px;">
      <h1 style="font-size:32px;font-weight:900;margin-bottom:8px;">${greeting}</h1>
      <p style="font-size:17px;color:var(--slate);">Prête à progresser en anglais professionnel aujourd'hui ?</p>
    </div>
    <div class="stat-grid">
      <div class="stat-card"><p class="stat-label">Mots appris</p><p class="stat-value">${state.learnedWords.length}</p></div>
      <div class="stat-card"><p class="stat-label">Conversations</p><p class="stat-value">${state.conversationCount}</p></div>
      <div class="stat-card"><p class="stat-label">Emails rédigés</p><p class="stat-value">${state.emailsWritten}</p></div>
      <div class="stat-card"><p class="stat-label">Simulations</p><p class="stat-value">${state.simsCompleted}</p></div>
    </div>
    <h2 style="font-size:20px;font-weight:800;margin-bottom:20px;">Continuer l'apprentissage</h2>
    <div class="card-grid">
      <div class="card" style="cursor:pointer;" onclick="navigate('vocab')">
        <div class="card-icon">◆</div>
        <h3 class="card-title">Vocabulaire e-commerce & digital</h3>
        <p class="card-desc">Flashcards, quiz et exercices sur le vocabulaire métier.</p>
      </div>
      <div class="card" style="cursor:pointer;" onclick="navigate('chat')">
        <div class="card-icon">●</div>
        <h3 class="card-title">Conversation libre</h3>
        <p class="card-desc">Discutez en anglais avec un agent IA qui corrige vos erreurs.</p>
      </div>
      <div class="card" style="cursor:pointer;" onclick="navigate('oral')">
        <div class="card-icon">🎙</div>
        <h3 class="card-title">Conversation orale</h3>
        <p class="card-desc">Parlez en anglais avec l'IA qui vous écoute, répond à voix haute et corrige.</p>
      </div>
      <div class="card" style="cursor:pointer;" onclick="navigate('sim')">
        <div class="card-icon">▲</div>
        <h3 class="card-title">Simulations pro</h3>
        <p class="card-desc">Daily standup, call client, sprint review… en conditions réelles.</p>
      </div>
      <div class="card" style="cursor:pointer;" onclick="navigate('email')">
        <div class="card-icon">✉</div>
        <h3 class="card-title">Rédaction d'emails</h3>
        <p class="card-desc">Apprenez à rédiger des emails pros clairs et efficaces.</p>
      </div>
      <div class="card" style="cursor:pointer;" onclick="navigate('meeting')">
        <div class="card-icon">■</div>
        <h3 class="card-title">Réunions & présentations</h3>
        <p class="card-desc">Structurez et animez vos réunions en anglais.</p>
      </div>
    </div>
  </div>`;
}

function renderProfile() {
  const activeUser = getActiveUser();
  if (!activeUser) return '';
  const initials = (activeUser.firstName[0] + activeUser.lastName[0]).toUpperCase();
  const fullName = `${activeUser.firstName} ${activeUser.lastName}`;
  const tr = state.testResult;
  const levelText = tr ? `${tr.level} — ${tr.labelFR}` : 'Non évalué';

  return `<div>
    <div class="profile-header">
      <div class="profile-avatar">${esc(initials)}</div>
      <div>
        <h1 class="profile-name">${esc(fullName)}</h1>
        <p class="profile-level">${esc(levelText)}</p>
      </div>
    </div>
    <div class="stat-grid">
      <div class="stat-card"><p class="stat-label">Mots appris</p><p class="stat-value">${state.learnedWords.length}</p></div>
      <div class="stat-card"><p class="stat-label">Conversations</p><p class="stat-value">${state.conversationCount}</p></div>
      <div class="stat-card"><p class="stat-label">Emails rédigés</p><p class="stat-value">${state.emailsWritten}</p></div>
      <div class="stat-card"><p class="stat-label">Simulations</p><p class="stat-value">${state.simsCompleted}</p></div>
    </div>
    <div style="display:flex;gap:12px;flex-wrap:wrap;">
      <button class="btn btn-outline" onclick="switchProfile()">Changer de profil</button>
      <button class="btn btn-danger btn-sm" onclick="if(confirm('Supprimer ce profil et toutes ses données ?'))deleteProfile()">Supprimer ce profil</button>
    </div>
  </div>`;
}

function renderVocabPage() {
  const filtered = getFilteredVocab();
  const card = filtered[state.cardIndex % filtered.length] || VOCAB[0];
  const cats = [
    { id: 'all', label: 'Tous' }, { id: 'pm', label: 'Gestion de projet' },
    { id: 'ecom', label: 'E-commerce' }, { id: 'tech', label: 'Tech' },
  ];
  const front = !state.flipped;
  const cardContent = front
    ? `<p class="flashcard-cat">${esc(card.cat)}</p><p class="flashcard-en">${esc(card.en)}</p><p class="flashcard-hint">Cliquez pour voir la traduction</p>`
    : `<p class="flashcard-cat">${esc(card.cat)}</p><p class="flashcard-en" style="font-size:28px;">${esc(card.en)}</p><p class="flashcard-fr">${esc(card.fr)}</p><p class="flashcard-example">${esc(card.example)}</p>`;

  return `<div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:32px;flex-wrap:wrap;gap:16px;">
      <div><h1 class="page-title">Vocabulaire métier</h1><p class="page-subtitle">E-commerce, gestion de projet, digital</p></div>
      <div class="filter-bar">
        ${cats.map(c => `<button class="filter-btn ${state.vocabCat === c.id ? 'active' : ''}" onclick="setVocabCat('${c.id}')">${c.label}</button>`).join('')}
      </div>
    </div>
    <div style="max-width:600px;margin:0 auto 40px;">
      <div class="flashcard" onclick="flipCard()">${cardContent}</div>
      <div class="flashcard-actions">
        <button class="btn btn-sm btn-hard" onclick="markHard()">À revoir</button>
        <button class="btn btn-sm btn-easy" onclick="markEasy()">Je connais</button>
        <button class="btn btn-sm btn-primary" onclick="nextCard()">Suivant →</button>
      </div>
      <p class="flashcard-progress">${(state.cardIndex % filtered.length) + 1} / ${filtered.length}</p>
    </div>
    <h2 style="font-size:18px;font-weight:800;margin-bottom:16px;">Liste complète</h2>
    <div class="vocab-grid">
      ${filtered.map(w => `<div class="vocab-item"><div><p class="vocab-en">${esc(w.en)}</p><p class="vocab-fr">${esc(w.fr)}</p></div><span class="tag tag-coral" style="white-space:nowrap;">${esc(w.cat)}</span></div>`).join('')}
    </div>
  </div>`;
}

function renderMeetings() {
  return `<div>
    <div class="page-header"><h1 class="page-title">Réunions & Présentations</h1><p class="page-subtitle">Apprenez les structures et le vocabulaire clé</p></div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;">
      ${MEETING_TYPES.map(mt => `<div class="meeting-card">
        <h3>${esc(mt.title)}</h3>
        ${mt.phrases.map(ph => `<div class="meeting-phrase"><p class="meeting-phrase-en">${esc(ph.en)}</p><p class="meeting-phrase-fr">${esc(ph.fr)}</p></div>`).join('')}
      </div>`).join('')}
    </div>
  </div>`;
}

function renderChatPage() {
  const msgs = state.chatMessages.map(m => {
    if (m.isCorrection) return `<div class="chat-bubble chat-bubble-correction"><p class="chat-correction-label">✏ Correction</p>${esc(m.text)}</div>`;
    return `<div class="chat-bubble ${m.role === 'user' ? 'chat-bubble-user' : 'chat-bubble-ai'}">${esc(m.text)}</div>`;
  }).join('');
  const typing = state.isTyping ? '<div class="chat-typing"><span>Typing…</span></div>' : '';
  return `<div class="chat-container">
    <div class="page-header"><h1 class="page-title">Conversation</h1><p class="page-subtitle">Discutez en anglais — l'IA corrige vos erreurs en temps réel</p></div>
    <div class="chat-messages" id="chat-messages">${msgs}${typing}</div>
    <div class="chat-input-bar">
      <input class="chat-input" type="text" placeholder="Écrivez en anglais…" value="${esc(state.chatInput)}" oninput="state.chatInput=this.value" onkeydown="handleChatKey(event, sendChatMessage)">
      <button class="btn btn-primary" onclick="sendChatMessage()">Envoyer</button>
    </div>
  </div>`;
}

function renderOralPage() {
  const showTopics = state.oralMessages.length <= 1;
  const showReset = state.oralMessages.length > 1;
  const isListening = state.listeningFor === 'oralInput';
  const micBg = isListening ? '#EF4444' : 'var(--navy)';
  const micShadow = isListening ? 'rgba(239,68,68,0.3)' : 'rgba(12,24,38,0.2)';
  const micLabel = isListening ? 'Écoute en cours…' : 'Appuyez pour parler';
  const hasTranscript = !!state.oralInput;

  const msgs = state.oralMessages.map((m, idx) => {
    const isUser = m.role === 'user';
    const speakBtn = (!isUser && !m.isCorrection) ? `<button class="oral-speak-btn" onclick="speakText(state.oralMessages[${idx}].text)">🔊 Écouter</button>` : '';
    if (m.isCorrection) return `<div class="chat-bubble chat-bubble-correction"><p class="chat-correction-label">✏ Correction</p>${esc(m.text)}</div>`;
    return `<div>
      <div class="chat-bubble ${isUser ? 'chat-bubble-user' : 'chat-bubble-ai'}">${esc(m.text)}</div>
      ${speakBtn}
    </div>`;
  }).join('');

  const typing = state.isOralTyping ? '<div class="chat-typing"><span>Typing…</span></div>' : '';

  const topicsHtml = showTopics ? `<div class="oral-topics">
    ${ORAL_TOPICS.map((t, i) => `<button class="oral-topic-btn" onclick="sendOralMessage(ORAL_TOPICS[${i}].prompt)">${t.label}</button>`).join('')}
  </div>` : '';

  const resetBtn = showReset ? `<button class="btn btn-outline btn-sm" onclick="resetOral()">← Changer de sujet</button>` : '';

  return `<div class="chat-container">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px;">
      <div>
        <h1 class="page-title">Conversation orale</h1>
        <p class="page-subtitle">Parlez en anglais — l'agent vous écoute, répond à voix haute et corrige</p>
      </div>
      ${resetBtn}
    </div>
    ${topicsHtml}
    <div class="chat-messages" id="oral-messages">${msgs}${typing}</div>
    <div style="padding-top:16px;border-top:1px solid var(--border);">
      <div style="text-align:center;padding:12px 0;">
        <button class="oral-mic-btn" style="background:${micBg};box-shadow:0 4px 20px ${micShadow};" onclick="toggleMic('oralInput')">🎙</button>
        <p class="oral-mic-label">${micLabel}</p>
      </div>
      ${hasTranscript ? `<div class="oral-transcript-bar">
        <div class="oral-transcript-text">${esc(state.oralInput)}</div>
        <button class="btn btn-primary btn-sm" onclick="sendOralMessage(state.oralInput)">Envoyer</button>
      </div>` : ''}
      <div style="display:flex;gap:8px;align-items:center;margin-top:8px;">
        <input class="oral-text-input" type="text" placeholder="Tapez votre réponse…" value="${esc(state.oralTextInput)}" oninput="state.oralTextInput=this.value" onkeydown="if(event.key==='Enter'){event.preventDefault();sendOralMessage(state.oralTextInput);}">
        <button class="btn btn-primary btn-sm" onclick="sendOralMessage(state.oralTextInput)">→</button>
      </div>
    </div>
  </div>`;
}

function renderSimPage() {
  if (state.activeSim) {
    const sc = SCENARIOS.find(s => s.id === state.activeSim);
    const msgs = state.simMessages.map(m => {
      if (m.isCorrection) return `<div class="chat-bubble chat-bubble-correction"><p class="chat-correction-label">✏ Correction</p>${esc(m.text)}</div>`;
      return `<div class="chat-bubble ${m.role === 'user' ? 'chat-bubble-user' : 'chat-bubble-ai'}">${esc(m.text)}</div>`;
    }).join('');
    const typing = state.isSimTyping ? '<div class="chat-typing"><span>Typing…</span></div>' : '';
    return `<div class="chat-container">
      <div class="sim-header"><div><p class="sim-header-label">Simulation en cours</p><p class="sim-header-title">${esc(sc ? sc.title : '')}</p></div><button class="btn btn-sm" style="background:rgba(255,255,255,0.1);color:white;" onclick="endSim()">Terminer</button></div>
      <div class="chat-messages" id="sim-messages">${msgs}${typing}</div>
      <div class="chat-input-bar">
        <input class="chat-input" type="text" placeholder="Répondez en anglais…" value="${esc(state.simInput)}" oninput="state.simInput=this.value" onkeydown="handleChatKey(event, sendSimMessage)">
        <button class="btn btn-primary" onclick="sendSimMessage()">Envoyer</button>
      </div>
    </div>`;
  }
  return `<div>
    <div class="page-header"><h1 class="page-title">Simulations professionnelles</h1><p class="page-subtitle">Entraînez-vous dans des situations réelles</p></div>
    <div class="card-grid">
      ${SCENARIOS.map(s => `<div class="card" style="cursor:pointer;" onclick="startSim('${s.id}')">
        <div class="card-icon">${s.icon}</div>
        <h3 class="card-title">${esc(s.title)}</h3>
        <p class="card-desc">${esc(s.desc)}</p>
        <div style="display:flex;gap:6px;margin-top:12px;flex-wrap:wrap;">
          <span class="tag tag-muted">${esc(s.diff)}</span>
          <span class="tag tag-muted">${esc(s.duration)}</span>
        </div>
      </div>`).join('')}
    </div>
  </div>`;
}

function renderEmailPage() {
  if (state.activeEmail) {
    const es = EMAIL_SCENARIOS.find(e => e.id === state.activeEmail);
    const feedbackHtml = state.emailFeedback ? `<div class="email-feedback"><h3 style="font-size:17px;font-weight:700;margin-bottom:12px;color:var(--coral);">✏ Feedback</h3>${esc(state.emailFeedback)}</div>` : '';
    const loadingHtml = state.emailLoading ? '<p style="margin-top:16px;color:var(--slate);font-size:15px;">Analyse en cours…</p>' : '';
    return `<div style="max-width:720px;">
      <div class="page-header"><h1 class="page-title">Rédaction d'emails</h1></div>
      <div class="email-brief"><p class="email-brief-label">Brief</p><p class="email-brief-text">${esc(es ? es.brief : '')}</p></div>
      <div class="email-editor">
        <div class="email-field"><label>To:</label><input type="text" placeholder="recipient@company.com" value="${esc(state.emailTo)}" oninput="state.emailTo=this.value"></div>
        <div class="email-field"><label>Subject:</label><input type="text" placeholder="Email subject" value="${esc(state.emailSubject)}" oninput="state.emailSubject=this.value"></div>
        <textarea class="email-body" placeholder="Write your email here in English…" oninput="state.emailBody=this.value">${esc(state.emailBody)}</textarea>
      </div>
      <div style="display:flex;gap:12px;margin-top:16px;">
        <button class="btn btn-primary" onclick="submitEmail()" ${state.emailLoading ? 'disabled' : ''}>Corriger mon email</button>
        <button class="btn btn-outline" onclick="cancelEmail()">Retour</button>
      </div>
      ${loadingHtml}${feedbackHtml}
    </div>`;
  }
  return `<div>
    <div class="page-header"><h1 class="page-title">Rédaction d'emails</h1><p class="page-subtitle">Choisissez un scénario et rédigez votre email</p></div>
    <div class="card-grid">
      ${EMAIL_SCENARIOS.map(es => `<div class="card" style="cursor:pointer;" onclick="startEmail('${es.id}')">
        <h3 class="card-title">${esc(es.title)}</h3>
        <p class="card-desc">${esc(es.desc)}</p>
      </div>`).join('')}
    </div>
  </div>`;
}

function render() {
  const root = document.getElementById('root');
  if (!state.activeUserId) {
    root.innerHTML = renderSessionSelect();
    return;
  }
  root.innerHTML = `
    <div class="app">
      <nav class="sidebar" id="sidebar"></nav>
      <main class="main" id="main"></main>
      <nav class="mobile-nav" id="mobile-nav"></nav>
    </div>
  `;
  renderSidebar();
  renderMain();
}

render();
</script>
</body>
</html>
